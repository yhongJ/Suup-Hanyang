spring:
  application:
    name: suuphanyang
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3307/suuphanyang?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:suuphanyang}
    password: ${DB_PASSWORD:suuphanyang}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # 스키마는 Flyway 관리
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB

app:
  zone: Asia/Seoul
  current-semester: 2026-2          # 현재 학기
  admin-key: ${ADMIN_KEY:change-me} # 운영은 환경변수 사용
  cors-origins: http://localhost:5500,http://127.0.0.1:5500

  auth:
    allowed-domain: hanyang.ac.kr
    code-ttl-minutes: 10
    max-attempts: 5                 # 코드당 시도 횟수
    rate-window-minutes: 10         # 제한 적용 시간(분)
    max-sends-per-window: 3         # 이메일당 발송 횟수
    ip-send-limit: 10               # IP당 발송 횟수
    ip-verify-limit: 30             # IP당 확인 횟수
    ip-admin-limit: 20              # IP당 관리자 API 횟수
    token-ttl-days: 30

  rule:
    check-opens-before-minutes: 60  # 끝남 체크는 종료 N분 전부터
    min-ended: 2                    # 끝남·휴강 최소 인원
    fresh-minutes: 10               # 끝남 체크 유효 시간(분)

  mail:
    mode: log                       # log: 콘솔 출력(개발용) / smtp: 메일 발송
    from: noreply@example.com
